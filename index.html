<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Chess</h1>
    <div class="controls">
      <div id="status" class="status" aria-live="polite"></div>
      <button id="new-game" type="button">New Game</button>
    </div>
    <div class="board-wrap">
      <div id="board" class="board" aria-label="Chessboard"></div>
      <div id="promotion" class="promotion-overlay" hidden>
        <div class="promotion-dialog" role="dialog" aria-modal="true" aria-labelledby="promotion-title">
          <p id="promotion-title" class="promotion-title">Promote pawn to:</p>
          <div id="promotion-choices" class="promotion-choices"></div>
          <button id="promotion-cancel" type="button" class="promotion-cancel">Cancel</button>
        </div>
      </div>
    </div>
  </main>
  <script src="chess.js"></script>
  <script src="main.js"></script>
</body>
</html>
